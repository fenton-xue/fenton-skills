<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>测试执行报告原型</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f6f8;
      --surface: #ffffff;
      --line: #dfe3e8;
      --text: #182230;
      --muted: #667085;
      --passed: #14804a;
      --passed-bg: #e8f7ef;
      --failed: #c4320a;
      --failed-bg: #fff0eb;
      --blocked: #9a6700;
      --blocked-bg: #fff7d6;
      --accent: #175cd3;
      --step-action: #64748b;
      --step-expected: #5b8def;
      --step-actual-pending: #cbd5e1;
      --step-actual-passed: #2fbf71;
      --step-actual-failed: #e25555;
      --step-actual-blocked: #e59a32;
      --report-max: 1500px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; color: var(--text); background: var(--bg); }
    button, input { font: inherit; }
    a { color: var(--accent); }
    .report-header {
      position: relative;
      overflow: hidden;
      color: white;
      background: linear-gradient(135deg, #14213d, #1d4ed8);
      padding: 32px clamp(20px, 5vw, 72px);
    }
    .header-row {
      max-width: var(--report-max);
      margin: 0 auto;
      display: flex;
      gap: 24px;
      align-items: flex-start;
      justify-content: space-between;
    }
    .header-copy {
      flex: 1;
      min-width: 0;
      padding-right: calc(clamp(120px, 8vw, 160px) + 32px);
    }
    .report-title {
      margin: 5px 0 8px;
      font-size: clamp(26px, 4vw, 42px);
      line-height: 1.2;
      white-space: nowrap;
    }
    .eyebrow { margin: 0; opacity: .72; letter-spacing: .12em; font-size: 12px; }
    .run-meta { margin: 0; opacity: .82; line-height: 1.8; }
    .report-signature {
      position: absolute;
      right: clamp(24px, 3vw, 48px);
      bottom: 24px;
      width: clamp(120px, 8vw, 160px);
      aspect-ratio: 2.36 / 1;
      overflow: hidden;
      opacity: 1;
      pointer-events: none;
    }
    .report-signature img {
      position: absolute;
      top: -67.9%;
      left: -18.4%;
      width: 129.8%;
      max-width: none;
      filter: invert(1) brightness(1.08);
    }
    .layout {
      width: 100%;
      margin: 0;
      padding: 24px;
      display: grid;
      grid-template-columns: clamp(288px, calc(40vw - 360px), 416px) minmax(0, 1fr);
      gap: 24px;
      align-items: start;
    }
    .sidebar {
      position: sticky;
      top: 18px;
      height: calc(100vh - 36px);
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      gap: 16px;
    }
    .panel, .case-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: 0 5px 20px rgba(16, 24, 40, .05);
    }
    .panel { padding: 16px; }
    .panel h2 { margin: 0 0 12px; font-size: 15px; }
    .summary-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .summary-card {
      cursor: pointer;
      min-width: 0;
      border: 1px solid transparent;
      border-radius: 10px;
      padding: 10px 4px;
      text-align: center;
      transition: border-color .15s ease, box-shadow .15s ease, transform .15s ease;
    }
    .summary-card:hover { transform: translateY(-1px); }
    .summary-card[aria-pressed="true"] {
      border-color: currentColor;
      box-shadow: 0 0 0 2px rgba(23, 92, 211, .12);
    }
    .summary-grid strong { display: block; font-size: 22px; }
    .summary-grid span { font-size: 11px; color: var(--muted); }
    .summary-grid .all { background: #eef4ff; color: var(--accent); }
    .summary-grid .passed { background: var(--passed-bg); color: var(--passed); }
    .summary-grid .failed { background: var(--failed-bg); color: var(--failed); }
    .summary-grid .blocked { background: var(--blocked-bg); color: var(--blocked); }
    .navigation-panel { min-height: 0; display: flex; flex-direction: column; }
    .case-nav { min-height: 0; flex: 1; overflow: auto; }
    .module-group { margin: 3px 0; }
    .module-group[hidden] { display: none; }
    .module-group > summary {
      cursor: pointer;
      list-style: none;
      display: grid;
      grid-template-columns: 14px minmax(0, 1fr) auto;
      gap: 5px;
      align-items: center;
      min-height: 30px;
      padding: 5px 6px;
      border-radius: 7px;
      color: #344054;
    }
    .module-group > summary::-webkit-details-marker { display: none; }
    .module-group > summary:hover { background: #f2f4f7; }
    .module-group > summary strong {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 12px;
    }
    .module-chevron {
      color: #98a2b3;
      font-size: 18px;
      line-height: 1;
      transform-origin: center;
      transition: transform .15s ease;
    }
    .module-group[open] > summary .module-chevron { transform: rotate(90deg); }
    .module-count {
      min-width: 20px;
      color: var(--muted);
      background: #f2f4f7;
      border-radius: 999px;
      padding: 2px 6px;
      text-align: center;
      font-size: 10px;
      font-weight: 700;
    }
    .module-children { margin-left: 12px; padding-left: 6px; border-left: 1px solid #eaecf0; }
    .case-nav a {
      display: grid;
      grid-template-columns: 24px minmax(0,1fr) auto;
      gap: 8px;
      align-items: center;
      color: inherit;
      text-decoration: none;
      padding: 8px;
      border-radius: 8px;
    }
    .case-nav a:hover { background: #f2f4f7; }
    .case-nav a[hidden] { display: none; }
    .case-nav strong { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; }
    .case-nav em { font-size: 9px; }
    .content { display: grid; gap: 16px; min-width: 0; }
    .case-card { overflow: hidden; scroll-margin-top: 18px; }
    .case-card[hidden] { display: none; }
    .case-card summary {
      cursor: pointer;
      list-style: none;
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      gap: 12px;
      align-items: center;
      padding: 17px 20px;
    }
    .case-card summary::-webkit-details-marker { display: none; }
    .case-card[open] summary { border-bottom: 1px solid var(--line); }
    .case-index { color: var(--muted); font-size: 12px; font-weight: 700; }
    .case-title { font-weight: 700; overflow-wrap: anywhere; }
    .status {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      padding: 4px 9px;
      font-style: normal;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .03em;
    }
    .status.passed { color: var(--passed); background: var(--passed-bg); }
    .status.failed { color: var(--failed); background: var(--failed-bg); }
    .status.blocked { color: var(--blocked); background: var(--blocked-bg); }
    .status.pending { color: var(--muted); background: #f2f4f7; }
    .case-body { padding: 20px; }
    dl { margin: 0; }
    .case-meta {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 1px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--line);
    }
    .case-meta div { background: white; padding: 12px; min-width: 0; }
    dt { color: var(--muted); font-size: 11px; font-weight: 700; margin-bottom: 5px; }
    dd { margin: 0; line-height: 1.55; overflow-wrap: anywhere; }
    .steps { display: grid; gap: 14px; margin-top: 18px; }
    .step-card { border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
    .step-heading { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .step-heading h3 { margin: 0; font-size: 16px; }
    .step-fields { display: grid; gap: 10px; margin-top: 14px; }
    .step-field { padding-left: 12px; border-left: 3px solid var(--line); }
    .step-field.action { border-left-color: var(--step-action); }
    .step-field.expected { border-left-color: var(--step-expected); }
    .step-field.actual.pending { border-left-color: var(--step-actual-pending); }
    .step-field.actual.passed { border-left-color: var(--step-actual-passed); }
    .step-field.actual.failed { border-left-color: var(--step-actual-failed); }
    .step-field.actual.blocked { border-left-color: var(--step-actual-blocked); }
    .evidence-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 12px;
      margin-top: 16px;
    }
    .evidence { margin: 0; min-width: 0; }
    .evidence-button {
      cursor: zoom-in;
      display: block;
      width: 100%;
      padding: 0;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #eef1f5;
    }
    .evidence img { display: block; width: 100%; height: 220px; object-fit: contain; }
    figcaption { color: var(--muted); margin-top: 6px; font-size: 11px; overflow-wrap: anywhere; }
    .empty-evidence { color: var(--muted); margin: 14px 0 0; font-size: 12px; }
    .load-error {
      max-width: 900px;
      margin: 40px auto;
      padding: 20px;
      color: var(--failed);
      background: var(--failed-bg);
      border: 1px solid #f7b27a;
      border-radius: 12px;
    }
    dialog {
      width: min(96vw, 1500px);
      max-width: none;
      padding: 0;
      border: 0;
      border-radius: 14px;
      background: #101828;
      box-shadow: 0 20px 80px rgba(0,0,0,.4);
    }
    dialog::backdrop { background: rgba(0,0,0,.72); }
    .lightbox-bar {
      color: white;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 14px;
    }
    .lightbox-bar span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .lightbox-bar button {
      cursor: pointer;
      color: white;
      border: 1px solid #475467;
      border-radius: 8px;
      background: #344054;
      padding: 7px 12px;
    }
    #lightbox-image { display: block; width: 100%; max-height: 86vh; object-fit: contain; background: #0b1220; }
    @media (max-width: 860px) {
      .layout { grid-template-columns: 1fr; padding: 14px; }
      .sidebar { position: static; height: auto; grid-template-rows: auto auto; }
      .case-nav { flex: none; max-height: 360px; }
      .case-meta { grid-template-columns: 1fr; }
      .header-row { display: block; }
    }
    @media (max-width: 700px) {
      .header-copy { padding-right: 0; }
      .report-signature { display: none; }
    }
    @media print {
      .sidebar, dialog { display: none; }
      .layout { display: block; padding: 0; }
      .case-card { break-inside: avoid; margin-bottom: 14px; box-shadow: none; }
      .case-card:not([open]) .case-body { display: block; }
      .evidence img { height: auto; max-height: 380px; }
    }
  </style>
</head>

  <script>
    (() => {
      "use strict";

      const CONFIGURED_SOURCE_DATA_FILE = "__TESTCASE_SOURCE_JS__";
      const viewerFileName = decodeURIComponent(location.pathname.split("/").pop() || "");
      const viewerMatch = /^(uat|pre)-testcase-viewer\.html$/i.exec(viewerFileName);
      const viewerEnvironment = viewerMatch ? viewerMatch[1].toLowerCase() : null;
      const SOURCE_DATA_FILE = viewerEnvironment
        ? `./${viewerEnvironment}-testcase-source.js`
        : CONFIGURED_SOURCE_DATA_FILE;
      const RESULT_DATA_FILE = viewerEnvironment
        ? `./execute-testcase/${viewerEnvironment}-execution-result.js`
        : "./execution-result.js";
      const REPORT_CREATED_AT = "__REPORT_CREATED_AT__";
      const RELOAD_INTERVAL_MS = 3000;
      const FINAL_STATUSES = new Set(["PASSED", "FAILED", "BLOCKED"]);
      const UUID_PATTERN = /^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i;
      let activeFilter = "all";
      let renderedSignature = "";

      function requireString(value, field) {
        if (typeof value !== "string" || value.trim() === "") {
          throw new TypeError(`${field} must be a non-empty string`);
        }
        return value;
      }

      function requireObject(value, field) {
        if (!value || typeof value !== "object" || Array.isArray(value)) {
          throw new TypeError(`${field} must be an object`);
        }
        return value;
      }

      function requireExactKeys(value, allowedKeys, field) {
        const actual = Object.keys(value).sort();
        const expected = [...allowedKeys].sort();
        if (
          actual.length !== expected.length ||
          actual.some((key, index) => key !== expected[index])
        ) {
          throw new TypeError(`${field} fields must be exactly: ${expected.join(", ")}`);
        }
      }

      function requireAllowedKeys(value, allowedKeys, field) {
        const allowed = new Set(allowedKeys);
        const unsupported = Object.keys(value).filter((key) => !allowed.has(key));
        if (unsupported.length > 0) {
          throw new TypeError(`${field} contains unsupported fields: ${unsupported.join(", ")}`);
        }
      }

      function requireUuid(value, field) {
        requireString(value, field);
        if (!UUID_PATTERN.test(value)) throw new TypeError(`${field} must be a standard UUID`);
        return value;
      }

      function requireEnvironment(value, field) {
        requireString(value, field);
        if (value !== "UAT" && value !== "PRE") {
          throw new TypeError(`${field} must be UAT or PRE`);
        }
        return value;
      }

      function normalizeStatus(value, field) {
        if (value === null || value === undefined || value === "") return null;
        if (!FINAL_STATUSES.has(value)) {
          throw new TypeError(`${field} must be PASSED, FAILED, BLOCKED, or null`);
        }
        return value;
      }

      function validateSource(source) {
        requireObject(source, "TESTCASE_SOURCE");
        requireExactKeys(
          source,
          ["source_id", "environment", "prd_name", "testcases"],
          "TESTCASE_SOURCE",
        );
        requireUuid(source.source_id, "TESTCASE_SOURCE.source_id");
        requireEnvironment(source.environment, "TESTCASE_SOURCE.environment");
        requireString(source.prd_name, "TESTCASE_SOURCE.prd_name");
        if (!Array.isArray(source.testcases) || source.testcases.length === 0) {
          throw new TypeError("TESTCASE_SOURCE.testcases must be a non-empty array");
        }
        source.testcases.forEach((testcase, caseIndex) => {
          const caseField = `TESTCASE_SOURCE.testcases[${caseIndex}]`;
          requireObject(testcase, caseField);
          requireExactKeys(
            testcase,
            ["id", "case_name", "module_path", "precondition", "steps"],
            caseField,
          );
          requireUuid(testcase.id, `${caseField}.id`);
          requireString(testcase.case_name, `${caseField}.case_name`);
          if (!Array.isArray(testcase.module_path) || testcase.module_path.length === 0) {
            throw new TypeError(`${caseField}.module_path must be a non-empty array`);
          }
          if (typeof testcase.precondition !== "string") {
            throw new TypeError(`${caseField}.precondition must be a string`);
          }
          if (!Array.isArray(testcase.steps) || testcase.steps.length === 0) {
            throw new TypeError(`${caseField}.steps must be a non-empty array`);
          }
          testcase.steps.forEach((step, stepIndex) => {
            const stepField = `${caseField}.steps[${stepIndex}]`;
            requireObject(step, stepField);
            requireExactKeys(step, ["step", "action", "expected"], stepField);
            if (!Number.isInteger(step.step) || step.step !== stepIndex + 1) {
              throw new TypeError(`${stepField}.step must be continuous from 1`);
            }
            requireString(step.action, `${stepField}.action`);
            requireString(step.expected, `${stepField}.expected`);
          });
        });
        return source;
      }

      function validateExecutionResult(executionResult, source) {
        if (executionResult === null || executionResult === undefined) return null;
        requireObject(executionResult, "TESTCASE_EXECUTION_RESULT");
        requireUuid(executionResult.source_id, "TESTCASE_EXECUTION_RESULT.source_id");
        if (executionResult.source_id.toLowerCase() !== source.source_id.toLowerCase()) {
          throw new TypeError("execution result source_id does not match Source");
        }
        requireEnvironment(
          executionResult.environment,
          "TESTCASE_EXECUTION_RESULT.environment",
        );
        if (executionResult.environment !== source.environment) {
          throw new TypeError(
            "execution result environment does not match Source",
          );
        }
        normalizeStatus(executionResult.result, "TESTCASE_EXECUTION_RESULT.result");
        requireObject(executionResult.cases, "TESTCASE_EXECUTION_RESULT.cases");
        requireAllowedKeys(
          executionResult,
          ["source_id", "system", "environment", "result", "cases"],
          "TESTCASE_EXECUTION_RESULT",
        );
        const sourceCases = new Map(source.testcases.map((testcase) => [testcase.id, testcase]));
        Object.entries(executionResult.cases).forEach(([caseId, caseResult]) => {
          requireUuid(caseId, `TESTCASE_EXECUTION_RESULT.cases key ${caseId}`);
          const sourceCase = sourceCases.get(caseId);
          if (!sourceCase) {
            throw new TypeError(`execution result contains unknown testcase UUID ${caseId}`);
          }
          const caseField = `TESTCASE_EXECUTION_RESULT.cases[${caseId}]`;
          requireObject(caseResult, caseField);
          requireAllowedKeys(
            caseResult,
            ["page_id", "actual_url", "result", "steps"],
            caseField,
          );
          normalizeStatus(caseResult.result, `${caseField}.result`);
          const stepResults = requireObject(caseResult.steps ?? {}, `${caseField}.steps`);
          Object.entries(stepResults).forEach(([stepNumber, stepResult]) => {
            if (!/^\d+$/.test(stepNumber) || !sourceCase.steps[Number(stepNumber) - 1]) {
              throw new TypeError(`${caseField}.steps contains unknown step ${stepNumber}`);
            }
            const stepField = `${caseField}.steps[${stepNumber}]`;
            requireObject(stepResult, stepField);
            requireAllowedKeys(stepResult, ["actual", "result", "screenshots"], stepField);
            normalizeStatus(stepResult.result, `${stepField}.result`);
            if (
              stepResult.screenshots !== undefined &&
              !Array.isArray(stepResult.screenshots)
            ) {
              throw new TypeError(`${stepField}.screenshots must be an array`);
            }
          });
        });
        return executionResult;
      }

      function buildViewModel(source, executionResult = null) {
        validateSource(source);
        const result = validateExecutionResult(executionResult, source);
        const caseResults = result ? result.cases : {};
        return {
          source_id: source.source_id,
          system: result?.system ?? null,
          prd_name: source.prd_name,
          environment: source.environment,
          result: normalizeStatus(result?.result, "viewModel.result"),
          testcases: source.testcases.map((testcase) => {
            const caseResult = requireObject(
              caseResults[testcase.id] ?? {},
              `TESTCASE_EXECUTION_RESULT.cases[${testcase.id}]`,
            );
            const stepResults = requireObject(
              caseResult.steps ?? {},
              `TESTCASE_EXECUTION_RESULT.cases[${testcase.id}].steps`,
            );
            return {
              id: testcase.id,
              case_name: testcase.case_name,
              module_path: testcase.module_path,
              precondition: testcase.precondition,
              page_id: caseResult.page_id ?? null,
              actual_url: caseResult.actual_url ?? null,
              result: normalizeStatus(caseResult.result, `case ${testcase.id}.result`),
              steps: testcase.steps.map((step) => {
                const stepResult = stepResults[step.step] ?? {};
                return {
                  step: step.step,
                  action: step.action,
                  expected: step.expected,
                  actual: stepResult.actual ?? null,
                  result: normalizeStatus(
                    stepResult.result,
                    `case ${testcase.id} step ${step.step}.result`,
                  ),
                  screenshots: Array.isArray(stepResult.screenshots)
                    ? stepResult.screenshots
                    : [],
                };
              }),
            };
          }),
        };
      }

      function validateViewModel(result) {
        requireObject(result, "viewModel");
        requireString(result.prd_name, "viewModel.prd_name");
        normalizeStatus(result.result, "viewModel.result");
        if (!Array.isArray(result.testcases) || result.testcases.length === 0) {
          throw new TypeError("viewModel.testcases must be a non-empty array");
        }
        result.testcases.forEach((testcase, caseIndex) => {
          normalizeStatus(testcase.result, `viewModel.testcases[${caseIndex}].result`);
          testcase.steps.forEach((step, stepIndex) => {
            normalizeStatus(
              step.result,
              `viewModel.testcases[${caseIndex}].steps[${stepIndex}].result`,
            );
          });
        });
        return result;
      }

      function escapeHtml(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#39;");
      }

      function displayValue(value) {
        return value === null || value === undefined || value === "" ? "—" : String(value);
      }

      function renderTestcaseText(value) {
        return escapeHtml(displayValue(value)).replaceAll("&lt;br&gt;", "<br>");
      }

      function statusClass(status) {
        return status === null || status === undefined || status === ""
          ? "pending"
          : requireString(status, "status").toLowerCase();
      }

      function statusLabel(status) {
        return status === null || status === undefined || status === "" ? "—" : status;
      }

      function screenshotUrl(value) {
        const screenshot = requireString(value, "screenshot").replaceAll("\\", "/");
        if (screenshot.startsWith("/") || screenshot.split("/").includes("..")) {
          throw new TypeError("screenshot must be a relative path");
        }
        return screenshot.split("/").map(encodeURIComponent).join("/");
      }

      function normalizeModulePath(modulePath) {
        if (!Array.isArray(modulePath)) return ["未分组"];
        const normalized = modulePath
          .filter((item) => item !== null && item !== undefined)
          .map((item) => String(item).trim())
          .filter(Boolean);
        return normalized.length ? normalized : ["未分组"];
      }

      function buildModuleTree(testcases) {
        const root = { children: new Map(), testcases: [] };
        testcases.forEach((testcase, index) => {
          let current = root;
          normalizeModulePath(testcase.module_path).forEach((moduleName) => {
            if (!current.children.has(moduleName)) {
              current.children.set(moduleName, { name: moduleName, children: new Map(), testcases: [] });
            }
            current = current.children.get(moduleName);
          });
          current.testcases.push({ testcase, index });
        });
        return root;
      }

      function countModuleTestcases(module) {
        return module.testcases.length + [...module.children.values()]
          .reduce((total, child) => total + countModuleTestcases(child), 0);
      }

      function renderNavigationCase(testcase, index) {
        return `
          <a class="case-nav-link" href="#case-${index + 1}" data-status="${statusClass(testcase.result)}">
            <span>${String(index + 1).padStart(2, "0")}</span>
            <strong>${escapeHtml(testcase.case_name)}</strong>
            <em class="status ${statusClass(testcase.result)}">${escapeHtml(statusLabel(testcase.result))}</em>
          </a>`;
      }

      function renderModuleNavigation(module, depth = 1) {
        const children = [...module.children.values()]
          .map((child) => renderModuleNavigation(child, depth + 1)).join("");
        const cases = module.testcases
          .map(({ testcase, index }) => renderNavigationCase(testcase, index)).join("");
        return `
          <details class="module-group" data-depth="${depth}"${depth === 1 ? " open" : ""}>
            <summary>
              <span class="module-chevron" aria-hidden="true">›</span>
              <strong title="${escapeHtml(module.name)}">${escapeHtml(module.name)}</strong>
              <span class="module-count">${countModuleTestcases(module)}</span>
            </summary>
            <div class="module-children">${children}${cases}</div>
          </details>`;
      }

      function renderScreenshot(screenshot, caseNo, stepNo, shotNo) {
        const url = screenshotUrl(screenshot);
        const filename = screenshot.replaceAll("\\", "/").split("/").at(-1);
        const alt = `用例 ${caseNo} 步骤 ${stepNo} 截图 ${shotNo}：${displayValue(filename)}`;
        return `
          <figure class="evidence">
            <button class="evidence-button" type="button" data-image="${escapeHtml(url)}" data-alt="${escapeHtml(alt)}">
              <img src="${escapeHtml(url)}" alt="${escapeHtml(alt)}" loading="lazy">
            </button>
            <figcaption>${escapeHtml(filename)}</figcaption>
          </figure>`;
      }

      function renderStep(step, caseNo) {
        const screenshots = Array.isArray(step.screenshots) && step.screenshots.length
          ? `<div class="evidence-grid">${step.screenshots
              .map((item, index) => renderScreenshot(item, caseNo, step.step, index + 1)).join("")}</div>`
          : '<p class="empty-evidence">本步骤无截图</p>';
        return `
          <section class="step-card">
            <div class="step-heading">
              <h3>步骤 ${escapeHtml(step.step)}</h3>
              <span class="status ${statusClass(step.result)}">${escapeHtml(statusLabel(step.result))}</span>
            </div>
            <dl class="step-fields">
              <div class="step-field action"><dt>操作</dt><dd>${renderTestcaseText(step.action)}</dd></div>
              <div class="step-field expected"><dt>预期</dt><dd>${renderTestcaseText(step.expected)}</dd></div>
              <div class="step-field actual ${statusClass(step.result)}"><dt>实际</dt><dd>${escapeHtml(displayValue(step.actual))}</dd></div>
            </dl>
            ${screenshots}
          </section>`;
      }

      function renderActualUrl(actualUrl) {
        if (actualUrl === null || actualUrl === undefined || actualUrl === "") return "—";
        try {
          const url = new URL(actualUrl);
          if (url.protocol === "http:" || url.protocol === "https:") {
            return `<a href="${escapeHtml(url.href)}" target="_blank" rel="noreferrer">${escapeHtml(actualUrl)}</a>`;
          }
        } catch {}
        return escapeHtml(actualUrl);
      }

      function renderTestcase(testcase, caseIndex) {
        const caseNo = caseIndex + 1;
        const modules = Array.isArray(testcase.module_path) ? testcase.module_path.join(" › ") : "—";
        return `
          <details id="case-${caseNo}" class="case-card" data-status="${statusClass(testcase.result)}"${testcase.result === "PASSED" ? "" : " open"}>
            <summary>
              <span class="case-index">用例 ${String(caseNo).padStart(2, "0")}</span>
              <span class="case-title">${escapeHtml(testcase.case_name)}</span>
              <span class="status ${statusClass(testcase.result)}">${escapeHtml(statusLabel(testcase.result))}</span>
            </summary>
            <div class="case-body">
              <dl class="case-meta">
                <div><dt>模块</dt><dd>${escapeHtml(modules)}</dd></div>
                <div><dt>页面</dt><dd>${escapeHtml(displayValue(testcase.page_id))}</dd></div>
                <div><dt>前置条件</dt><dd>${renderTestcaseText(testcase.precondition)}</dd></div>
                <div><dt>URL</dt><dd>${renderActualUrl(testcase.actual_url)}</dd></div>
              </dl>
              <div class="steps">${testcase.steps.map((step) => renderStep(step, caseNo)).join("")}</div>
            </div>
          </details>`;
      }

      function bindInteractions() {
        const caseCards = [...document.querySelectorAll(".case-card")];
        const navLinks = [...document.querySelectorAll(".case-nav-link")];
        const moduleGroups = [...document.querySelectorAll(".module-group")];
        const filterCards = [...document.querySelectorAll("[data-filter]")];

        function updateModuleGroups(filter) {
          [...moduleGroups].reverse().forEach((group) => {
            const visibleCount = [...group.querySelectorAll(".case-nav-link")]
              .filter((link) => !link.hidden).length;
            group.hidden = visibleCount === 0;
            group.querySelector(":scope > summary .module-count").textContent = String(visibleCount);
            if (filter !== "all" && visibleCount > 0) group.open = true;
          });
        }

        function applyFilter(filter) {
          activeFilter = filter;
          filterCards.forEach((card) => card.setAttribute("aria-pressed", String(card.dataset.filter === filter)));
          caseCards.forEach((card) => {
            card.hidden = filter !== "all" && card.dataset.status !== filter;
          });
          navLinks.forEach((link) => {
            link.hidden = filter !== "all" && link.dataset.status !== filter;
          });
          updateModuleGroups(filter);
        }

        filterCards.forEach((card) => card.addEventListener("click", () => applyFilter(card.dataset.filter)));
        navLinks.forEach((link) => {
          link.addEventListener("click", (event) => {
            const target = document.querySelector(link.getAttribute("href"));
            if (!target) return;
            event.preventDefault();
            target.open = true;
            target.scrollIntoView({ behavior: "smooth", block: "start" });
            history.replaceState(null, "", link.getAttribute("href"));
          });
        });

        const dialog = document.querySelector("#lightbox");
        const dialogImage = document.querySelector("#lightbox-image");
        const dialogTitle = document.querySelector("#lightbox-title");
        document.querySelectorAll(".evidence-button").forEach((button) => {
          button.addEventListener("click", () => {
            dialogImage.src = button.dataset.image;
            dialogImage.alt = button.dataset.alt;
            dialogTitle.textContent = button.dataset.alt;
            dialog.showModal();
          });
        });

        applyFilter(activeFilter);
      }

      let titleFitFrame = null;

      function fitReportTitle() {
        const title = document.querySelector("#report-title");
        title.style.removeProperty("font-size");
        const maximumFontSize = Number.parseFloat(getComputedStyle(title).fontSize);
        const availableWidth = title.clientWidth;
        if (!title.textContent || !availableWidth || !maximumFontSize) return;
        if (title.scrollWidth <= availableWidth) return;

        let lower = 0.5;
        let upper = maximumFontSize;
        for (let iteration = 0; iteration < 14; iteration += 1) {
          const middle = (lower + upper) / 2;
          title.style.fontSize = `${middle}px`;
          if (title.scrollWidth <= availableWidth) lower = middle;
          else upper = middle;
        }
        let fittedFontSize = Math.floor(lower * 100) / 100;
        title.style.fontSize = `${fittedFontSize}px`;
        while (title.scrollWidth > availableWidth && fittedFontSize > 0.5) {
          fittedFontSize = Math.max(0.5, fittedFontSize - 0.01);
          title.style.fontSize = `${fittedFontSize}px`;
        }
      }

      function scheduleReportTitleFit() {
        if (titleFitFrame !== null) cancelAnimationFrame(titleFitFrame);
        titleFitFrame = requestAnimationFrame(() => {
          titleFitFrame = null;
          fitReportTitle();
        });
      }

      window.addEventListener("resize", scheduleReportTitleFit);

      function renderReport(result) {
        validateViewModel(result);
        const counts = { PASSED: 0, FAILED: 0, BLOCKED: 0 };
        result.testcases.forEach((testcase) => {
          if (FINAL_STATUSES.has(testcase.result)) counts[testcase.result] += 1;
        });
        const title = [result.system, result.prd_name].filter(Boolean).join("-");
        const moduleTree = buildModuleTree(result.testcases);

        document.title = title;
        document.querySelector("#report-title").textContent = title;
        scheduleReportTitleFit();
        document.querySelector("#run-meta").innerHTML = [
          result.environment ? String(result.environment).toUpperCase() : null,
          REPORT_CREATED_AT,
        ].filter(Boolean).map(escapeHtml).join("<br>");
        document.querySelector("#summary-grid").innerHTML = `
          <button class="summary-card all" type="button" data-filter="all" aria-pressed="true"><strong>${result.testcases.length}</strong><span>ALL</span></button>
          <button class="summary-card passed" type="button" data-filter="passed" aria-pressed="false"><strong>${counts.PASSED}</strong><span>PASSED</span></button>
          <button class="summary-card failed" type="button" data-filter="failed" aria-pressed="false"><strong>${counts.FAILED}</strong><span>FAILED</span></button>
          <button class="summary-card blocked" type="button" data-filter="blocked" aria-pressed="false"><strong>${counts.BLOCKED}</strong><span>BLOCKED</span></button>`;
        document.querySelector("#case-nav").innerHTML = [...moduleTree.children.values()]
          .map((module) => renderModuleNavigation(module)).join("");
        document.querySelector("#case-content").innerHTML = result.testcases.map(renderTestcase).join("");
        document.querySelector("#load-error").hidden = true;
        document.querySelector("#report-layout").hidden = false;
        bindInteractions();
      }

      function showError(error) {
        const errorBox = document.querySelector("#load-error");
        errorBox.textContent = `无法加载用例数据：${error.message}`;
        errorBox.hidden = false;
        document.querySelector("#report-layout").hidden = true;
      }

      function dataSignature(result) {
        return JSON.stringify(result);
      }

      function currentViewModel() {
        if (window.TESTCASE_SOURCE) {
          return buildViewModel(
            window.TESTCASE_SOURCE,
            window.TESTCASE_EXECUTION_RESULT ?? null,
          );
        }
        throw new TypeError("Source file did not define window.TESTCASE_SOURCE");
      }

      function renderCurrentData() {
        const viewModel = currentViewModel();
        const nextSignature = dataSignature(viewModel);
        if (nextSignature !== renderedSignature) {
          renderReport(viewModel);
          renderedSignature = nextSignature;
        }
        window.TESTCASE_VIEW_MODEL = viewModel;
        return viewModel;
      }

      function loadDataScript(dataFile, { required }) {
        return new Promise((resolve, reject) => {
          const script = document.createElement("script");
          const url = new URL(dataFile, location.href);
          url.searchParams.set("reload", String(Date.now()));
          script.src = url.href;
          script.onload = () => {
            script.remove();
            resolve(true);
          };
          script.onerror = () => {
            script.remove();
            if (required) reject(new Error(`无法加载必需数据文件 ${dataFile}`));
            else resolve(false);
          };
          document.head.append(script);
        });
      }

      async function pollDataFiles() {
        window.TESTCASE_SOURCE = undefined;
        window.TESTCASE_EXECUTION_RESULT = undefined;
        try {
          await loadDataScript(SOURCE_DATA_FILE, { required: true });
          await loadDataScript(RESULT_DATA_FILE, { required: false });
          renderCurrentData();
        } catch (error) {
          showError(error);
        }
      }

      document.querySelector("#lightbox-close").addEventListener("click", () => {
        document.querySelector("#lightbox").close();
      });
      document.querySelector("#lightbox").addEventListener("click", (event) => {
        if (event.target === event.currentTarget) event.currentTarget.close();
      });

      window.TESTCASE_VIEWER_BUILD_VIEW_MODEL = buildViewModel;
      window.TESTCASE_VIEWER_VALIDATE_SOURCE = validateSource;
      window.TESTCASE_VIEWER_RELOAD = pollDataFiles;

      async function initialize() {
        await pollDataFiles();
        window.TESTCASE_REPORT_READY = true;
        window.TESTCASE_REPORT_RELOAD_INTERVAL_MS = RELOAD_INTERVAL_MS;
        setInterval(pollDataFiles, RELOAD_INTERVAL_MS);
      }

      initialize().catch(showError);
    })();
  </script>
</body>
</html>
