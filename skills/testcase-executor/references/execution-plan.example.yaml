system: QC

testcases:
  - case_name: ZJXT-126499-01-组合货号关联多个子货号
    module_path:
      - QC报告审核
      - 审核明细
      - 组合货号查询-结果准确性
    page_id: qc-report-review
    precondition: null
    steps:
      - step: 1
        action: 在组合货号查询框输入“CBSKUTEST003”，其他查询条件保持为空，点击“查询”按钮
        expected: 查询结果总数为22条

      - step: 2
        action: 统计查询结果中货号为“AA12P30391R”的审核明细
        expected: 货号为“AA12P30391R”的审核明细共7条

      - step: 3
        action: 逐条查看22条审核明细的组合货号
        expected: 22条审核明细的组合货号均非空并显示“CBSKUTEST003”
